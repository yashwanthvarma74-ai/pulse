# The service level objectives in docs/SLOS.md, written as alerts. Each one fires only when the
# objective has been missed for long enough to matter, not on a single slow request.
groups:
  - name: pulse-slos
    rules:
      - alert: FeedLatencyHigh
        expr: histogram_quantile(0.95, sum by (le) (rate(pulse_feed_request_duration_ms_bucket[5m]))) > 300
        for: 10m
        labels: { severity: page }
        annotations:
          summary: Feed p95 is over 300 ms
          description: The first page of the feed is slower than the objective. Check Redis latency, the size of the candidate pool and MongoDB slow queries.

      - alert: NotificationDeliverySlow
        expr: histogram_quantile(0.95, sum by (le) (rate(pulse_notification_delivery_ms_bucket{stage="gateway"}[5m]))) > 500
        for: 10m
        labels: { severity: page }
        annotations:
          summary: Notification delivery p95 is over 500 ms
          description: Events are taking too long from the queue to the gateway. Look for queue backlog and worker saturation.

      - alert: FanoutLagHigh
        expr: histogram_quantile(0.95, sum by (le) (rate(pulse_fanout_lag_ms_bucket{mode="push"}[5m]))) > 5000
        for: 10m
        labels: { severity: ticket }
        annotations:
          summary: Fan-out is more than 5 s behind
          description: New posts are reaching follower timelines late. Consider lowering FANOUT_THRESHOLD or adding workers.

      - alert: ApiErrorRateHigh
        expr: sum(rate(pulse_http_request_duration_ms_count{status=~"5.."}[5m])) / sum(rate(pulse_http_request_duration_ms_count[5m])) > 0.01
        for: 5m
        labels: { severity: page }
        annotations:
          summary: More than 1% of API requests fail
          description: Server errors are above the objective.

      - alert: ScrollSmoothnessLow
        expr: sum(rate(pulse_scroll_fps_bucket{le="55"}[30m])) / sum(rate(pulse_scroll_fps_count[30m])) > 0.2
        for: 30m
        labels: { severity: ticket }
        annotations:
          summary: More than a fifth of scrolls run under 55 frames per second
          description: Reported by real browsers. A front end change may have made the feed heavier.
