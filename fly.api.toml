# Deploy from the repository root:  fly deploy -c fly.api.toml
# First time:  fly apps create pulse-api   then set the secrets listed in docs/DEPLOY.md.
# NOT YET RUN on Fly.
app = "pulse-api"
primary_region = "iad"

[build]
  dockerfile = "apps/api/Dockerfile"

[env]
  NODE_ENV = "production"
  API_PORT = "4001"
  STORAGE_DRIVER = "s3"
  S3_REGION = "auto"
  S3_BUCKET = "pulse-media"
  # Vercel and Fly are two proxies in front of the API
  TRUST_PROXY_HOPS = "2"
  LOG_LEVEL = "info"
  # SITE_ORIGIN, COOKIE_DOMAIN, MONGODB_URI, REDIS_URL, JWT_SECRET, S3_ENDPOINT, S3_ACCESS_KEY_ID and
  # S3_SECRET_ACCESS_KEY are secrets or per-domain values: see docs/DEPLOY.md

[http_service]
  internal_port = 4001
  force_https = true
  # WebSockets and the repair sweep need it always on
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "15s"
    interval = "15s"
    timeout = "3s"
    method = "GET"
    path = "/health"

[metrics]
  port = 9464
  path = "/metrics"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
